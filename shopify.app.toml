# https://shopify.dev/docs/apps/build/cli-for-apps/app-configuration
# Run `npm run config:link` to replace client_id and the URLs with your Dev Dashboard app.

name = "Tap Credit Card (case study)"
client_id = "<API_CLIENT_ID>"
application_url = "https://example.com"
embedded = false

[access_scopes]
scopes = "write_payment_gateways,write_payment_sessions"

[auth]
redirect_urls = ["https://example.com/auth/callback"]

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  topics = ["app/uninstalled"]
  uri = "/webhooks"

  [[webhooks.subscriptions]]
  compliance_topics = ["customers/data_request", "customers/redact", "shop/redact"]
  uri = "/webhooks"

[build]
automatically_update_urls_on_dev = true
include_config_on_deploy = true
